# ARTEX Tencent TSec Benchmark mirror – local one-click build + run. It does not interfere with
# production docker-compose.yml (multi-service: artex+postgres). Use: cp bench/.env.example
# bench/.env # Fill in LLM_API_KEY / BENCHMARK_TOKEN etc docker compose -f docker-compose.bench.yml
# up --build # Build and run front end (see logs) docker compose -f docker-compose.bench.yml up
# --build -d # Backend docker compose -f docker-compose.bench.yml logs -f docker compose -f
# docker-compose.bench.yml down # Stop (plus -v delete data volume) Browser: http://localhost:8787
# (login with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share network with physical machine: Container uses host network stack directly to connect
    # directly to target network on host/VPN. In host mode, without ports mapping, container binds
    # directly to host ports: 8787 (UI/API), 8788 (proxy), and internal PostgreSQL 5432 — make sure
    # the host has these three ports free (stop using them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
