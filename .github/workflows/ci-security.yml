name: CI and security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22.23.5"
  SEMGREP_VERSION: "1.185.0"
  TRIVY_VERSION: "v0.76.2"

jobs:
  build-and-test:
    name: Build frontend/backend
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify unit tests exist
        shell: bash
        run: |
          go_tests="$(find . -type f -name '*_test.go' | wc -l)"
          web_tests="$(find web -type f \( -name '*.test.*' -o -name '*.spec.*' \) | wc -l)"
          test "$go_tests" -gt 0
          test "$web_tests" -gt 0
          echo "Go test files: $go_tests"
          echo "Frontend test files: $web_tests"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test and build frontend
        working-directory: web
        run: |
          node --test src/lib/*.test.mjs
          npm run build:static

      - name: Stage frontend for embedded backend build
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/

      - name: Build integrated application
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -tags embedui -o dist/artex ./cmd/artex

      - name: Smoke-test backend binary
        run: ./dist/artex -h

  go-tests:
    name: Go tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            packages: ./agent
          - name: database
            packages: ./db
          - name: server
            packages: ./server
          - name: remaining
            packages: ./cmd/artex ./config ./evidence ./guard ./intercept ./llmpool ./llmrec ./mcphttp ./notify ./selfupdate ./sidequestion ./traffic
    services:
      postgres:
        image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex_ci
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARTEX_PG_DSN: postgres://artex:artex_ci@localhost:5432/artex?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The parallel matrix jobs share the same go.sum and therefore the
          # same setup-go cache key. Let the build job own that cache to avoid
          # concurrent post-job writers racing to reserve one key.
          cache: false

      - name: Run Go tests
        # The server suite starts background workers that currently expose
        # upstream global-state races during teardown. Keep the required CI
        # deterministic while those races are tracked separately.
        run: go test -p 1 -count=1 -coverprofile=coverage.out ${{ matrix.packages }}

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: .semgrep-rules
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep
        run: >-
          semgrep scan
          --error
          --strict
          --metrics=off
          --severity ERROR
          --exclude .semgrep-rules
          --config .semgrep-rules/go/lang/security
          --config .semgrep-rules/go/gorilla/security
          --config .semgrep-rules/go/jwt-go/security
          --config .semgrep-rules/go/template/security
          --config .semgrep-rules/javascript/lang/security
          --config .semgrep-rules/typescript/lang/security
          --config .semgrep-rules/typescript/react/security
          --config .semgrep-rules/typescript/mcp/security
          .

  cve-and-secrets:
    name: Trivy CVE, secret and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository with pinned Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
